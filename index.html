<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/labeval_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabEval RUET - Lab Performance Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Apply theme BEFORE React mounts to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="/LabEval/assets/index-ya3IOcxW.js"></script>
    <link rel="stylesheet" crossorigin href="/LabEval/assets/index-C3zPWQWW.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
